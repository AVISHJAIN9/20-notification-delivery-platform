version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ntf-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ntf_user
      POSTGRES_PASSWORD: ntf_password
    ports:
      - "5420:5432"
    volumes:
      - ntf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntf_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ntf-redis
    ports:
      - "6320:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ntf_pg_data:
